<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Task | Eric</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <aside class="side-menu">
        <div class="side-menu__top">

            <header class="header">
                <div class="header__left">
                    <button class="side-menu__round-button" type="button">
                        <img src="assets/style-project__close.svg" alt="close menu">
                    </button>

                    <div>
                        <img src="assets/style-project__logo.svg" alt="CPS logo">
                    </div>
                </div>

                <button class="side-menu__round-button" type="button">
                    <img src="assets/style-project__search.svg" alt="search">
                </button>
            </header>

            <nav class="nav">

                <div class="nav__top">
                    <img src="assets/style-project__menu-highlight.svg" alt="">
                    <span class="nav__title">
                        Equipment repair
                    </span>
                </div>
                <ul class="nav__list">

                    <li class="nav__item">
                        <a class="nav__button nav__button--current" href="#Services">Services and solutions</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__button nav__button-hover" href="#Corporate">Corporate clients</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__button" href="#Equipment">Equipment sellers</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__button" href="#Partners">Partners</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__button" href="#Manufacturers">Manufacturers</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__button" href="#Service-centers">Our service centres</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__button" href="#Contacts">Contacts</a>
                    </li>
                </ul>

            </nav>
        </div>


        <footer class="footer">
            <div class="footer__contact">

                <div class="footer__actions">
                    <button class="side-menu__round-button" type="button">
                        <img src="assets/style-project__call.svg" alt="Call">
                    </button>
                    <button class="side-menu__round-button" type="button">
                        <img src="assets/style-project__chat.svg" alt="Chat">
                    </button>
                    <button class="side-menu__round-button" type="button">
                        <img src="assets/style-project__profile.svg" alt="Profile">
                    </button>
                </div>

                <div class="footer__contact-info">
                    <div class="footer__email">mail@cps.com</div>
                    <div class="footer__phone">8 800 890 8900</div>
                </div>
            </div>

            <div class="footer__i18n">
                <button type="button" class="footer__i18n-button footer__i18n-button--current">RU</button>
                <button type="button" class="footer__i18n-button">EN</button>
                <button type="button" class="footer__i18n-button">CH</button>
            </div>
        </footer>

    </aside>
</body>

</html>
